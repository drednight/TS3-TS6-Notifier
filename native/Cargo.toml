[package]
name = "tsn-native"
version = "2.0.16"
edition = "2021"
description = "TS3-TS6 Notifier — native core (Rust): TeamSpeak connectors, state, HTTP/WS server"

[[bin]]
name = "TS3-TS6-Notifier-Overlay"
path = "src/main.rs"

[dependencies]
# zero external crates — the sandbox builds offline

[profile.release]
opt-level = 2
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tsn_win32)'] }
