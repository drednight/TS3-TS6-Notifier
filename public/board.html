<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TS3-TS6 Notifier — Soundboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body data-theme="glass" class="board-page">
  <div id="board">
    <header id="boardHeader">
      <div class="board-title" data-i18n="boardTitle"></div>
      <div class="board-actions">
        <button id="boardGear" class="icon-btn" title="Settings" aria-label="Settings"></button>
      </div>
    </header>

    <nav class="board-menu">
      <button id="menuAdd" class="board-menu-btn primary" data-i18n="boardMenuAdd"></button>
      <button id="menuPresets" class="board-menu-btn" data-i18n="addPresets"></button>
      <button id="menuDelete" class="board-menu-btn danger" data-i18n="boardMenuDelete"></button>
      <button id="menuStop" class="board-menu-btn" data-i18n="stopSound"></button>
      <button id="menuHotkeys" class="board-menu-btn" data-i18n="hotkeysEnabled"></button>
      <button id="menuEdit" class="board-menu-btn" data-i18n="editSound"></button>
      <span class="board-menu-spacer"></span>
      <button id="menuAudio" class="board-menu-btn" data-i18n="boardMenuAudio"></button>
      <input type="file" id="boardUpload" accept="audio/*" hidden />
    </nav>

    <div id="audioPop" class="board-audio-pop" hidden>
      <div class="pop-card">
        <div class="pop-title">
          <span data-i18n="localSound"></span>
          <input type="checkbox" id="popLocalEnabled" />
        </div>
        <div class="pop-row">
          <span class="pop-label" data-i18n="soundsVolume"></span>
          <input type="range" id="popLocalVol" min="0" max="1" step="0.05" value="0.8" />
        </div>
        <div class="pop-row">
          <span class="pop-label" data-i18n="outputDevice"></span>
          <select id="popLocalDevice"><option value="" data-i18n="outputDeviceDefault"></option></select>
        </div>
      </div>
      <div class="pop-card">
        <div class="pop-title">
          <span data-i18n="channelSound"></span>
          <input type="checkbox" id="popChannelEnabled" />
        </div>
        <div class="pop-row">
          <span class="pop-label" data-i18n="soundsVolume"></span>
          <input type="range" id="popChannelVol" min="0" max="1" step="0.05" value="0.8" />
        </div>
        <div class="pop-row">
          <span class="pop-label" data-i18n="outputDevice"></span>
          <select id="popChannelDevice"><option value="" data-i18n="outputDeviceDefault"></option></select>
        </div>
      </div>
    </div>

    <div id="boardEdit" class="board-edit-pop" hidden>
      <div class="edit-title" id="editTitle"></div>
      <div class="pop-row">
        <span class="pop-label" data-i18n="soundName"></span>
        <input type="text" id="editName" />
      </div>
      <div class="pop-row">
        <span class="pop-label" data-i18n="soundGroup"></span>
        <input type="text" id="editGroup" />
      </div>
      <div class="pop-row">
        <span class="pop-label" data-i18n="soundsVolume"></span>
        <input type="range" id="editVol" min="0" max="1" step="0.05" value="1" />
      </div>
      <div class="pop-row">
        <span class="pop-label" data-i18n="hotkeyLabel"></span>
        <div class="edit-key-row">
          <span id="editKey" class="hotkey-cap"></span>
          <button id="editKeySet" class="icon-btn" title="Hotkey">⌨</button>
          <button id="editKeyClear" class="icon-btn" title="Clear">×</button>
        </div>
      </div>
      <div class="pop-row">
        <span class="pop-label" data-i18n="soundStart"></span>
        <input type="number" id="editStart" min="0" step="0.1" value="0" />
      </div>
      <div class="pop-row">
        <span class="pop-label" data-i18n="soundEnd"></span>
        <input type="number" id="editEnd" min="0" step="0.1" value="0" />
      </div>
      <div class="edit-actions">
        <button id="editDelete" class="board-menu-btn danger" data-i18n="deleteSound"></button>
        <button id="editCancel" class="board-menu-btn" data-i18n="cancel"></button>
        <button id="editSave" class="board-menu-btn primary" data-i18n="saveSound"></button>
      </div>
    </div>
    <main id="boardBody">
      <div id="boardGrid" class="board-grid"></div>
    </main>
    <div id="boardEmpty" class="empty-state" hidden>
      <div class="empty-title" data-i18n="soundsEmpty"></div>
      <div class="empty-sub" data-i18n="boardEmptySub"></div>
    </div>
    <footer class="board-foot">
      <span class="board-hint" data-i18n="boardHint"></span>
    </footer>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/features.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
