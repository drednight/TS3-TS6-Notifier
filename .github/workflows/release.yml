name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle desktop main
        run: npm run bundle

      - name: Typecheck & tests
        shell: pwsh
        run: |
          npm run typecheck
          npm test 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content tests.log -Tail 45) -join "`n"
            $tail = $tail -replace "`r?`n", "%0A"
            echo "::error title=tests failed::$tail"
            exit 1
          }

      - name: Render icons
        run: npm run icons

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build TS3 plugin DLL
        shell: cmd
        run: |
          cd plugin
          if not exist dist mkdir dist
          cl /nologo /LD /O2 /MD /W3 /I include ts3plugin_tsn.c /Fe:dist\ts3plugin_tsn_win64.dll /link ws2_32.lib
          if errorlevel 1 exit /b 1
          dir dist

      - name: Verify packaged file layout
        shell: pwsh
        run: |
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) {
            echo "::error title=packaged layout check failed::see log above"
            exit 1
          }

      - name: Build Windows app (installer)
        shell: pwsh
        run: |
          npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 45) -join "`n"
            $tail = $tail -replace "`r?`n", "%0A"
            echo "::error title=electron-builder failed::$tail"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            plugin/dist/ts3plugin_tsn_win64.dll
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            plugin/dist/ts3plugin_tsn_win64.dll
          generate_release_notes: true
          body: |
            ## TS3-TS6 Notifier ${{ github.ref_name }}

            Скачайте **TS3-TS6-Notifier-Setup-*.exe** — установщик Windows.

            ### Первый запуск
            1. Запустите exe (Windows может показать SmartScreen — «Подробнее» → «Всё равно запустить»).
            2. Иконка появится в трее — правый клик → **Data source** → TeamSpeak 3 или 6.
            3. TS3: Настройки → Плагины → Client Query → API key (вставить в Settings).
            4. TS6: Настройки → Remote Apps → включить → разрешить приложение при запросе.
            5. Оверлей поверх игры: оконный / безрамочный режим игры.
            6. Рекомендуется: установите **ts3plugin_tsn_win64.dll** (в приложении «Ещё» → «Плагин TS3» → «Установить плагин», затем включите его в TeamSpeak и перезапустите клиент) — события без задержек и обрывов.
