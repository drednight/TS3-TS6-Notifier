# Bootstrap: packs the Rust toolchain into git objects under refs/notes/* so
# the sandbox (no access to static.rust-lang.org / Azure blobs) can fetch it
# via plain git from github.com. NOT a release — no tags, no binaries.
name: native-toolchain (bootstrap)
on:
  push:
    paths: ['.github/workflows/native-toolchain.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pack toolchain
        run: |
          set -x
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git"
          tar -C "$HOME" -czf /tmp/toolchain.tgz .rustup .cargo/bin
          ls -la /tmp/toolchain.tgz
          mkdir /tmp/pack && cd /tmp/pack
          split -b 88m /tmp/toolchain.tgz toolchain.part.
          ls -la
          git init -q . && git add .
          git -c user.email=ci@tsn -c user.name=ci commit -qm "toolchain bootstrap"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/notes/tsn-toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Report status
        if: always()
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="native-toolchain bootstrap: ${{ job.status }} — ref refs/notes/tsn-toolchain updated (gzip toolchain, split 88MB parts)" || true
        env:
          GH_TOKEN: ${{ github.token }}
